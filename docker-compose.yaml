services:
  grafana:
    image: grafana/grafana:13.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - loki
      - tempo
      - prometheus
    networks:
      - monitoring
    # Matches grafana/alloy example: curl + /healthz
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  loki:
    image: grafana/loki:3.6.13
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki.yaml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    expose:
      - "3100"
    networks:
      - monitoring
    # No healthcheck: distroless (no shell/wget), same as grafana/alloy example.

  tempo:
    image: grafana/tempo:2.9.4
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo-config.yml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo-config.yml:ro
      - tempo-data:/var/tempo
    expose:
      - "3200" # Tempo HTTP (Grafana query)
      - "4317" # OTLP gRPC (internal, from Alloy)
      - "4318" # OTLP HTTP (internal, from Alloy)
    networks:
      - monitoring
    # No healthcheck: distroless (no shell/wget), same as grafana/alloy example.

  prometheus:
    image: prom/prometheus:v3.13.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  alloy:
    image: grafana/alloy:v1.18.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/alloy/alloy-entrypoint.sh"]
    environment:
      OTLP_TENANTS: ${OTLP_TENANTS:?set OTLP_TENANTS e.g. acme:secret1,beta:secret2}
      OTLP_HTPASSWD_FILE: /tmp/otlp.htpasswd
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ./scripts/alloy-entrypoint.sh:/etc/alloy/alloy-entrypoint.sh:ro
      - alloy-data:/var/lib/alloy/data
    expose:
      - "12345" # Alloy UI / metrics
      - "4317" # OTLP gRPC (apps → reverse proxy → Alloy)
      - "4318" # OTLP HTTP
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    networks:
      - monitoring
    # No healthcheck: matches grafana/alloy example (image has no wget/curl).

volumes:
  grafana-data:
  loki-data:
  tempo-data:
  prometheus-data:
  alloy-data:

networks:
  monitoring:
    driver: bridge
